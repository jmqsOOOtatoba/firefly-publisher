<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f59e0b' d='M16 2c1.5 6 6 9.5 12 11-6 1.5-10.5 5-12 11-1.5-6-6-9.5-12-11 6-1.5 10.5-5 12-11z'/%3E%3C/svg%3E"
		/>
		<title>Firefly 发布台</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f7f7f8;
				--card: #ffffff;
				--ink: #1a1a1c;
				--muted: #6b6b70;
				--line: #e4e4e7;
				--accent: #d97706;
				--accent-ink: #ffffff;
				--ok: #16a34a;
				--ok-bg: #f0fdf4;
				--ok-line: #bbf7d0;
				--err: #dc2626;
				--err-bg: #fef2f2;
				--err-line: #fecaca;
				--field-bg: #ffffff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f1115;
					--card: #17191e;
					--ink: #e8e8ea;
					--muted: #9a9aa3;
					--line: #2a2d35;
					--accent: #f59e0b;
					--accent-ink: #1a1200;
					--ok: #4ade80;
					--ok-bg: #0d2215;
					--ok-line: #14532d;
					--err: #f87171;
					--err-bg: #2a1215;
					--err-line: #7f1d1d;
					--field-bg: #101216;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
			}
			body {
				background: var(--bg);
				color: var(--ink);
				font-family:
					-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
					"Segoe UI", sans-serif;
				font-size: 15px;
				line-height: 1.6;
				-webkit-font-smoothing: antialiased;
				padding: 24px 16px 48px;
			}
			.wrap {
				max-width: 720px;
				margin: 0 auto;
			}
			header {
				margin-bottom: 20px;
			}
			header h1 {
				font-size: 22px;
				font-weight: 700;
				margin: 0 0 4px;
				letter-spacing: 0.02em;
			}
			header h1 .fly {
				color: var(--accent);
			}
			header p {
				margin: 0;
				color: var(--muted);
				font-size: 13px;
			}
			.card {
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 14px;
				padding: 20px;
				margin-bottom: 16px;
			}
			label {
				display: block;
				font-size: 13px;
				font-weight: 600;
				margin-bottom: 6px;
				color: var(--ink);
			}
			.hint {
				font-weight: 400;
				color: var(--muted);
				margin-left: 6px;
			}
			input[type="text"],
			input[type="password"],
			input[type="date"],
			input[type="number"],
			select,
			textarea {
				width: 100%;
				background: var(--field-bg);
				color: var(--ink);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 10px 12px;
				font-size: 15px;
				font-family: inherit;
				outline: none;
				transition: border-color 0.15s;
			}
			input:focus,
			textarea:focus,
			select:focus {
				border-color: var(--accent);
			}
			textarea {
				min-height: 240px;
				resize: vertical;
				font-family: ui-monospace, "SF Mono", Consolas, "Microsoft YaHei", monospace;
				font-size: 14px;
				line-height: 1.7;
			}
			textarea.short {
				min-height: 72px;
			}
			.row {
				display: flex;
				gap: 10px;
				align-items: end;
			}
			.row > div {
				flex: 1;
				min-width: 0;
			}
			.seg {
				display: flex;
				gap: 6px;
				background: var(--bg);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 4px;
				margin-bottom: 18px;
			}
			.seg button {
				flex: 1;
				border: 0;
				background: transparent;
				color: var(--muted);
				font: inherit;
				font-size: 14px;
				font-weight: 600;
				padding: 8px 4px;
				border-radius: 7px;
				cursor: pointer;
				transition:
					background 0.15s,
					color 0.15s;
			}
			.seg button.active {
				background: var(--card);
				color: var(--ink);
				box-shadow: 0 1px 3px rgb(0 0 0 / 0.12);
			}
			.field {
				margin-bottom: 16px;
			}
			.hidden {
				display: none;
			}
			details {
				border: 1px dashed var(--line);
				border-radius: 10px;
				padding: 10px 14px;
				margin-bottom: 16px;
			}
			details summary {
				cursor: pointer;
				font-size: 13px;
				font-weight: 600;
				color: var(--muted);
				user-select: none;
			}
			details[open] summary {
				margin-bottom: 12px;
				color: var(--ink);
			}
			.check {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 14px;
				cursor: pointer;
			}
			.check input {
				width: 16px;
				height: 16px;
				accent-color: var(--accent);
			}
			.publish-btn {
				width: 100%;
				border: 0;
				border-radius: 10px;
				background: var(--accent);
				color: var(--accent-ink);
				font: inherit;
				font-size: 16px;
				font-weight: 700;
				padding: 13px;
				cursor: pointer;
				transition: opacity 0.15s;
			}
			.publish-btn:disabled {
				opacity: 0.55;
				cursor: not-allowed;
			}
			.result {
				border-radius: 10px;
				padding: 12px 14px;
				font-size: 14px;
				margin-top: 14px;
				word-break: break-all;
			}
			.result.ok {
				background: var(--ok-bg);
				border: 1px solid var(--ok-line);
				color: var(--ok);
			}
			.result.err {
				background: var(--err-bg);
				border: 1px solid var(--err-line);
				color: var(--err);
			}
			.result code {
				font-size: 13px;
				background: rgb(0 0 0 / 0.06);
				padding: 1px 5px;
				border-radius: 4px;
			}
			footer {
				text-align: center;
				color: var(--muted);
				font-size: 12px;
			}
			footer a {
				color: var(--muted);
			}

			/* ---- 顶栏 / 登录 ---- */
			.topbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				margin-bottom: 16px;
			}
			.topbar .seg {
				margin-bottom: 0;
				flex: 1;
				max-width: 340px;
			}
			.link-btn {
				background: none;
				border: 0;
				color: var(--muted);
				font: inherit;
				font-size: 13px;
				cursor: pointer;
				padding: 6px 10px;
				border-radius: 6px;
				white-space: nowrap;
			}
			.link-btn:hover {
				color: var(--ink);
				background: var(--card);
			}

			/* ---- 管理 ---- */
			.mg-toolbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 12px;
			}
			.mg-toolbar .status {
				font-size: 12px;
				color: var(--muted);
			}
			.btn-sm {
				border: 1px solid var(--line);
				background: var(--field-bg);
				color: var(--ink);
				border-radius: 8px;
				padding: 7px 14px;
				font: inherit;
				font-size: 13px;
				cursor: pointer;
			}
			.btn-sm:hover {
				border-color: var(--accent);
			}
			.mg-group {
				margin-bottom: 18px;
			}
			.mg-group h4 {
				font-size: 13px;
				color: var(--muted);
				margin: 0 0 8px;
				font-weight: 600;
			}
			.mg-item {
				display: flex;
				align-items: center;
				gap: 10px;
				width: 100%;
				text-align: left;
				background: var(--field-bg);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 10px 12px;
				margin-bottom: 8px;
				cursor: pointer;
				font: inherit;
				color: var(--ink);
			}
			.mg-item:hover {
				border-color: var(--accent);
			}
			.mg-item .t {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 14px;
			}
			.mg-item .n {
				font-size: 12px;
				color: var(--muted);
				font-family: ui-monospace, Consolas, monospace;
				white-space: nowrap;
			}
			.badge {
				font-size: 11px;
				padding: 1px 7px;
				border-radius: 99px;
				border: 1px solid var(--line);
				color: var(--muted);
				white-space: nowrap;
			}
			.badge.draft {
				border-color: color-mix(in srgb, var(--accent) 45%, transparent);
				color: var(--accent);
			}
			.mg-editor-head {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 10px;
			}
			.mg-editor-head .file {
				font-family: ui-monospace, Consolas, monospace;
				font-size: 12px;
				color: var(--muted);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			textarea.editor {
				min-height: 340px;
			}
			.mg-actions {
				display: flex;
				gap: 10px;
				margin-top: 10px;
			}
			.btn-danger {
				border: 1px solid var(--err-line);
				background: var(--err-bg);
				color: var(--err);
				border-radius: 8px;
				padding: 7px 14px;
				font: inherit;
				font-size: 13px;
				cursor: pointer;
			}
			.btn-primary {
				border: 0;
				background: var(--accent);
				color: var(--accent-ink);
				border-radius: 8px;
				padding: 7px 16px;
				font: inherit;
				font-size: 13px;
				font-weight: 600;
				cursor: pointer;
			}
			.btn-primary:disabled,
			.btn-sm:disabled,
			.btn-danger:disabled {
				opacity: 0.55;
				cursor: not-allowed;
			}
			#mg-preview {
				margin-top: 14px;
				border-top: 1px dashed var(--line);
				padding-top: 12px;
			}
			.fm-note {
				font-family: ui-monospace, Consolas, monospace;
				font-size: 11px;
				color: var(--muted);
				white-space: pre-wrap;
				word-break: break-all;
				background: var(--bg);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 8px 10px;
				margin-bottom: 12px;
				max-height: 120px;
				overflow: auto;
			}
			.md-body {
				font-size: 15px;
				line-height: 1.75;
			}
			.md-body > :first-child {
				margin-top: 0;
			}
			.md-body h1,
			.md-body h2,
			.md-body h3,
			.md-body h4 {
				line-height: 1.35;
				margin: 1.2em 0 0.5em;
			}
			.md-body h1 {
				font-size: 1.4em;
			}
			.md-body h2 {
				font-size: 1.25em;
			}
			.md-body h3 {
				font-size: 1.1em;
			}
			.md-body p,
			.md-body ul,
			.md-body ol {
				margin: 0.7em 0;
			}
			.md-body ul,
			.md-body ol {
				padding-left: 1.5em;
			}
			.md-body pre {
				background: var(--bg);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 12px;
				overflow: auto;
				font-size: 13px;
			}
			.md-body code {
				font-family: ui-monospace, Consolas, monospace;
				font-size: 0.92em;
				background: var(--bg);
				padding: 1px 5px;
				border-radius: 4px;
			}
			.md-body pre code {
				background: none;
				padding: 0;
			}
			.md-body blockquote {
				border-left: 3px solid var(--accent);
				margin: 0.8em 0;
				padding: 2px 0 2px 12px;
				color: var(--muted);
			}
			.md-body img {
				max-width: 100%;
				border-radius: 8px;
			}
			.md-body a {
				color: var(--accent);
			}
			.md-body table {
				border-collapse: collapse;
				width: 100%;
				margin: 0.8em 0;
				font-size: 14px;
			}
			.md-body th,
			.md-body td {
				border: 1px solid var(--line);
				padding: 6px 10px;
				text-align: left;
			}
			.md-body hr {
				border: 0;
				border-top: 1px solid var(--line);
				margin: 1.4em 0;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<header>
				<h1><span class="fly">◈</span> Firefly 发布台</h1>
				<p>写好 Markdown，选类型，一键提交到博客仓库自动上线</p>
			</header>

			<!-- 登录 -->
			<div class="card" id="view-login">
				<div class="field">
					<label for="login-token">访问口令</label>
					<input
						type="password"
						id="login-token"
						placeholder="请输入发布台口令"
						autocomplete="current-password"
					/>
				</div>
				<button type="button" class="publish-btn" id="login-btn">登录</button>
				<div class="result hidden" id="login-result"></div>
			</div>

			<!-- 主界面 -->
			<div id="view-main" class="hidden">
				<div class="topbar">
					<div class="seg" role="tablist" aria-label="功能页">
						<button type="button" data-tab="publish" class="active">发布</button>
						<button type="button" data-tab="manage">管理</button>
					</div>
					<button type="button" class="link-btn" id="logout-btn">退出登录</button>
				</div>

				<!-- 发布 -->
				<div class="card" id="tab-publish">
					<div class="seg" role="tablist" aria-label="内容类型">
						<button type="button" data-type="post" class="active">文章</button>
						<button type="button" data-type="update">更新公告</button>
						<button type="button" data-type="dynamic">动态</button>
					</div>

					<div class="field" id="title-field">
						<label for="title">标题</label>
						<input type="text" id="title" placeholder="文章标题" />
					</div>

					<div class="field">
						<label for="content">正文 <span class="hint">Markdown，图片贴外链</span></label>
						<textarea
							id="content"
							placeholder="## 小标题&#10;&#10;在这里粘贴写好的 Markdown 正文……"
						></textarea>
					</div>

					<details id="extras">
						<summary>可选字段（留空则不写入文章）</summary>
						<div class="field" id="f-updated">
							<label for="updated">更新日期<span class="hint">未设置则默认使用发布日期</span></label>
							<input type="date" id="updated" />
						</div>
						<div class="field" id="f-description">
							<label for="description">描述<span class="hint">显示在首页文章卡片上</span></label>
							<textarea class="short" id="description"></textarea>
						</div>
						<div class="field" id="f-image">
							<label for="image">封面图片<span class="hint">路径或外链</span></label>
							<input type="text" id="image" placeholder="https://... 或 /images/cover.jpg" />
						</div>
						<div class="row">
							<div class="field" id="f-tags">
								<label for="tags">标签<span class="hint">逗号分隔</span></label>
								<input type="text" id="tags" placeholder="教程, Windows" />
							</div>
							<div class="field" id="f-category">
								<label for="category">分类</label>
								<input type="text" id="category" placeholder="技术分享" />
							</div>
						</div>
						<div class="row">
							<div class="field" id="f-draft">
								<label class="check"><input type="checkbox" id="draft" /> 草稿（不对读者可见）</label>
							</div>
							<div class="field" id="f-pinned">
								<label class="check"><input type="checkbox" id="pinned" /> 置顶</label>
							</div>
						</div>
						<div class="field" id="f-slug">
							<label for="slug">slug<span class="hint">自定义 URL 路径</span></label>
							<input type="text" id="slug" placeholder="azuma.zuomu-blog-17，留空用文件名" />
						</div>
						<div class="field" id="f-lang">
							<label for="lang">语言<span class="hint">仅与站点默认不同时设置</span></label>
							<input type="text" id="lang" placeholder="zh-CN" />
						</div>
						<div class="field" id="f-author">
							<label for="author">作者</label>
							<input type="text" id="author" placeholder="左沐" />
						</div>
						<div class="field" id="f-comment">
							<label for="comment">评论</label>
							<select id="comment">
								<option value="">留空（默认开启）</option>
								<option value="true">开启</option>
								<option value="false">关闭</option>
							</select>
						</div>
						<div class="row">
							<div class="field" id="f-licenseName">
								<label for="licenseName">许可证名称</label>
								<input type="text" id="licenseName" placeholder="CC BY-NC-SA 4.0" />
							</div>
							<div class="field" id="f-licenseUrl">
								<label for="licenseUrl">许可证链接</label>
								<input type="text" id="licenseUrl" placeholder="https://..." />
							</div>
						</div>
						<div class="field" id="f-sourceLink">
							<label for="sourceLink">文章来源</label>
							<input type="text" id="sourceLink" placeholder="原文链接" />
						</div>
						<div class="row">
							<div class="field" id="f-password">
								<label for="password">文章密码<span class="hint">设置后加密</span></label>
								<input type="password" id="password" autocomplete="new-password" />
							</div>
							<div class="field" id="f-passwordHint">
								<label for="passwordHint">密码提示</label>
								<input type="text" id="passwordHint" placeholder="显示在密码框上方" />
							</div>
						</div>
						<div class="row">
							<div class="field" id="f-series">
								<label for="series">系列</label>
								<input type="text" id="series" placeholder="系列名称" />
							</div>
							<div class="field" id="f-seriesOrder">
								<label for="seriesOrder">系列序号<span class="hint">升序</span></label>
								<input type="number" id="seriesOrder" step="1" placeholder="1" />
							</div>
						</div>
						<div class="field" id="f-location">
							<label for="location">位置<span class="hint">仅动态</span></label>
							<input type="text" id="location" placeholder="辽宁" />
						</div>
					</details>

					<button type="button" class="publish-btn" id="publish">发布</button>
					<div class="result hidden" id="result"></div>
				</div>

				<!-- 管理 -->
				<div class="card hidden" id="tab-manage">
					<!-- 列表态 -->
					<div id="mg-list">
						<div class="mg-toolbar">
							<span class="status" id="mg-status"></span>
							<button type="button" class="btn-sm" id="mg-refresh">刷新列表</button>
						</div>
						<div id="mg-groups"></div>
					</div>
					<!-- 编辑态 -->
					<div id="mg-editor" class="hidden">
						<div class="mg-editor-head">
							<button type="button" class="btn-sm" id="mg-back">← 返回</button>
							<span class="file" id="mg-file"></span>
						</div>
						<textarea id="mg-content" class="editor" spellcheck="false"></textarea>
						<div class="mg-actions">
							<button type="button" class="btn-sm" id="mg-preview-btn">预览</button>
							<button type="button" class="btn-primary" id="mg-save">保存</button>
							<button type="button" class="btn-danger" id="mg-delete">删除</button>
						</div>
						<div id="mg-preview" class="hidden">
							<div class="fm-note" id="mg-fm"></div>
							<div class="md-body" id="mg-rendered"></div>
						</div>
						<div class="result hidden" id="mg-result"></div>
					</div>
				</div>
			</div>

			<footer>内容经 GitHub 自动提交至博客仓库，构建约 3~5 分钟后生效</footer>
		</div>

		<script src="/vendor/marked.umd.js"></script>
		<script src="/app.js"></script>
	</body>
</html>
